<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/png" href="Favicon.png">
    <link rel="apple-touch-icon" href="Favicon.png">

    <title>ALFRÉDS | Urban Dew</title>
    <meta name="description" content="Discover Urban Dew by ALFRÉDS. A masterpiece of olfactory art, capturing the unseen essence of high-society elegance.">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #c5a059;
            --black: #0a0a0a;
            --white: #ffffff;
            --cream: #faf9f5;
            --ease: cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* --- GLOBAL RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- KINETIC CURSOR --- */
        #cursor {
            position: fixed;
            top: 0; left: 0;
            width: 12px; height: 12px;
            background: var(--gold);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            mix-blend-mode: difference;
            transform: translate(-50%, -50%);
            transition: width 0.3s var(--ease), height 0.3s var(--ease);
        }

        /* --- NAVIGATION --- */
        nav {
            position: fixed;
            top: 0; width: 100%;
            padding: 35px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            mix-blend-mode: difference;
        }

        .nav-brand {
            font-size: 14px;
            letter-spacing: 12px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* --- HERO SECTION --- */
        .hero {
            position: relative;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000;
        }

        .hero-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.6) contrast(1.1);
        }

        .hero-vignette {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            animation: elegantFade 3s var(--ease) forwards;
        }

        .main-logo {
            width: clamp(250px, 40vw, 450px);
            display: block;
            margin: 0 auto;
            mix-blend-mode: screen; 
            filter: drop-shadow(0px 10px 30px rgba(0,0,0,0.5)); 
        }

        /* --- SHOWCASE SECTION --- */
        .showcase {
            background-color: var(--cream);
            color: var(--black);
            padding: 15vh 8%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 10%;
            min-height: 100vh;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-style: italic;
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 30px;
        }

        .product-image-box {
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
        }

        .product-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- ANIMATIONS --- */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.2s var(--ease), transform 1.2s var(--ease);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes elegantFade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 900px) {
            .showcase { grid-template-columns: 1fr; text-align: center; }
            #cursor { display: none; }
        }
    </style>
</head>
<body>

    <div id="cursor"></div>

    <nav>
        <div class="nav-brand">ALFRÉDS</div>
    </nav>

    <header class="hero">
        <video class="hero-video" autoplay muted loop playsinline poster="img.png">
            <source src="yep.mp4" type="video/mp4">
        </video>
        <div class="hero-vignette"></div>
        
        <div class="hero-content">
            <img src="img.png" alt="ALFRÉDS Logo" class="main-logo">
        </div>
    </header>

    <section class="showcase">
        <div class="showcase-text">
            <h2 class="section-title reveal">Urban Dew</h2>
            <p class="reveal">
                A masterpiece of olfactory art. Capturing the unseen essence of high-society elegance with notes of rare botanicals.
            </p>
        </div>
        
        <div class="product-image-box reveal">
            <img src="yes.png" alt="Urban Dew Perfume" class="product-image" loading="lazy">
        </div>
    </section>

    <script>
        const cursor = document.getElementById('cursor');
        let mX = 0, mY = 0, cX = 0, cY = 0;
        document.addEventListener('mousemove', (e) => { mX = e.clientX; mY = e.clientY; });
        function animate() {
            cX += (mX - cX) * 0.15;
            cY += (mY - cY) * 0.15;
            cursor.style.left = cX + 'px';
            cursor.style.top = cY + 'px';
            requestAnimationFrame(animate);
        }
        animate();

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
