<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>ALFRÉDS | Urban Dew</title>
    
    <meta name="description" content="Discover Urban Dew by ALFRÉDS. A masterpiece of olfactory art, capturing the unseen essence of high-society elegance with notes of rare botanicals and liquid gold.">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #c5a059;
            --gold-dark: #a38242;
            --black: #0a0a0a;
            --white: #ffffff;
            --cream: #faf9f5;
            --ease: cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* --- GLOBAL & RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::selection { background: var(--gold); color: var(--white); }

        /* --- KINETIC LUXURY CURSOR --- */
        #cursor {
            position: fixed;
            top: 0; left: 0;
            width: 12px; height: 12px;
            background: var(--gold);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            mix-blend-mode: difference;
            transform: translate(-50%, -50%);
            transition: width 0.3s var(--ease), height 0.3s var(--ease), background-color 0.3s;
        }

        /* --- NAVIGATION --- */
        nav {
            position: fixed;
            top: 0; width: 100%;
            padding: 35px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            mix-blend-mode: difference;
        }

        .nav-brand {
            font-size: 14px;
            letter-spacing: 12px;
            text-transform: uppercase;
            font-weight: 300;
            color: var(--white);
        }

        .nav-links {
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        /* --- HERO SECTION (VIDEO OVERLAY) --- */
        .hero {
            position: relative;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .hero-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.6) contrast(1.1);
            transform: scale(1.05);
        }

        .hero-vignette {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: elegantFade 3s var(--ease) forwards;
        }

        .main-logo {
            width: clamp(250px, 40vw, 450px);
            margin-bottom: 30px;
            filter: drop-shadow(0px 10px 30px rgba(0,0,0,0.5)); 
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            font-size: 9px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--white);
            opacity: 0.6;
            animation: pulse 2s infinite;
        }

        .scroll-line {
            width: 1px;
            height: 40px;
            background: var(--gold);
            margin: 10px auto 0;
        }

        /* --- SHOWCASE SECTION (SCROLL REVEAL) --- */
        .showcase {
            background-color: var(--cream);
            color: var(--black);
            padding: 15vh 8%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 10%;
            min-height: 100vh;
        }

        .showcase-text {
            max-width: 500px;
        }

        .section-subtitle {
            font-size: 11px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 20px;
            display: block;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-style: italic;
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 30px;
            color: var(--black);
        }

        .section-desc {
            font-size: 14px;
            line-height: 1.8;
            font-weight: 300;
            color: #555;
            margin-bottom: 50px;
        }

        /* Luxury Button */
        .btn-buy {
            display: inline-block;
            padding: 18px 45px;
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--black);
            border: 1px solid var(--black);
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: color 0.4s var(--ease);
        }

        .btn-buy::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--gold);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s var(--ease);
            z-index: -1;
        }

        /* Image Side */
        .showcase-image-container {
            position: relative;
            width: 100%;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
        }

        /* --- ANIMATION CLASSES --- */
        .reveal-up {
            opacity: 0;
            transform: translateY(60px);
            transition: opacity 1.2s var(--ease), transform 1.2s var(--ease);
        }

        .reveal-up.active {
            opacity: 1;
            transform: translateY(0);
        }

        .delay-1 { transition-delay: 0.2s; }
        .delay-2 { transition-delay: 0.4s; }

        @keyframes elegantFade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
            50% { opacity: 1; transform: translateX(-50%) translateY(5px); }
            100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 900px) {
            .showcase {
                grid-template-columns: 1fr;
                padding: 10vh 5%;
                text-align: center;
            }
            .showcase-text { margin: 0 auto 50px auto; }
            .showcase-image-container { height: 60vh; }
            #cursor { display: none; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <div id="cursor"></div>

    <nav>
        <div class="nav-brand">Alfréds</div>
        <div class="nav-links">The Collection</div>
    </nav>

    <header class="hero">
        <video class="hero-video" autoplay muted loop playsinline>
            <source src="yep.mp4" type="video/mp4">
        </video>
        <div class="hero-vignette"></div>
        
        <div class="hero-content">
            <img src="img.png" alt="ALFREDS Logo" class="main-logo">
        </div>

        <div class="scroll-indicator">
            Discover
            <div class="scroll-line"></div>
        </div>
    </header>

    <section class="showcase">
        <div class="showcase-text">
            <span class="section-subtitle reveal-up">The Signature Blend</span>
            <h2 class="section-title reveal-up delay-1">Urban Dew</h2>
            <p class="section-desc reveal-up delay-1">
                A masterpiece of olfactory art. Encased in exquisite glass, Urban Dew captures the unseen essence of high-society elegance. With notes of rare botanicals and liquid gold, it is not just a fragrance—it is an inheritance.
            </p>
            <div class="reveal-up delay-2">
                <a href="#" class="btn-buy interactive-btn">Acquire Now</a>
            </div>
        </div>
        
        <div class="showcase-image-container reveal-up delay-2">
            <img src="yes.png" alt="Urban Dew Perfume Bottle" class="product-image">
        </div>
    </section>

    <script>
        // 1. Custom Kinetic Cursor Logic
        const cursor = document.getElementById('cursor');
        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Smooth cursor follow
        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.2;
            cursorY += (mouseY - cursorY) * 0.2;
            cursor.style.left = cursorX + 'px';
            cursor.style.top = cursorY + 'px';
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Cursor morph on hover over buttons
        const interactives = document.querySelectorAll('.interactive-btn');
        interactives.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.width = '60px';
                cursor.style.height = '60px';
                cursor.style.backgroundColor = 'transparent';
                cursor.style.border = '1px solid var(--gold)';
                // Fill button with gold effect
                el.style.color = '#fff';
                el.style.borderColor = 'var(--gold)';
                el.style.setProperty('--pseudo-transform', 'scaleY(1)');
            });
            
            // Replicate CSS hover state via JS for the pseudo element
            el.addEventListener('mousemove', () => {
                 el.style.cssText = `color: #fff; border-color: var(--gold);`;
                 const style = document.createElement('style');
                 style.innerHTML = `.btn-buy:hover::before { transform: scaleY(1); }`;
                 document.head.appendChild(style);
            });

            el.addEventListener('mouseleave', () => {
                cursor.style.width = '12px';
                cursor.style.height = '12px';
                cursor.style.backgroundColor = 'var(--gold)';
                cursor.style.border = 'none';
                el.style.color = 'var(--black)';
                el.style.borderColor = 'var(--black)';
            });
        });

        // 2. Intersection Observer for Scroll Animations
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.15 
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        // Attach observer to all elements with .reveal-up class
        document.querySelectorAll('.reveal-up').forEach((el) => {
            observer.observe(el);
        });
    </script>
</body>
</html>
